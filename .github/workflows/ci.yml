# Every push to master and every pull request: the repository rules (tools/check_repo.py) and the engine patches
# applying to the pinned SurrealEngine, the game and the unit tests (src/tests/) built and run on Windows, Linux and
# macOS, and the unit tests again under AddressSanitizer and UBSan. None of it needs the games' files; the tests that
# do run locally (tools/smoke_test.py).
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Repository rules
        run: python3 tools/check_repo.py

      - name: The engine patches apply
        run: bash tools/apply_patches.sh

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-2025
          - platform: linux
            os: ubuntu-24.04
          - platform: macos
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Apply the engine patches
        run: bash tools/apply_patches.sh

      - name: Linux packages
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-14 libx11-dev libxi-dev libxkbcommon-dev libasound2-dev \
            libopenal-dev libfontconfig-dev libgl-dev libopengl-dev libegl-dev libglib2.0-dev libdbus-1-dev

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        run: |
          cmake -S src/engine -B build -A x64
          cmake --build build --config Release --target SurrealEngine FlipendoTests --parallel

      - name: Build (Linux)
        if: matrix.platform == 'linux'
        run: |
          cmake -S src/engine -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_C_COMPILER=gcc-14
          cmake --build build --target SurrealEngine FlipendoTests

      - name: Build (macOS)
        if: matrix.platform == 'macos'
        run: |
          cmake -S src/engine -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build --target SurrealEngine FlipendoTests --parallel $(sysctl -n hw.ncpu)

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Apply the engine patches
        run: bash tools/apply_patches.sh

      - name: Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-14 libx11-dev libxi-dev libxkbcommon-dev libasound2-dev \
            libopenal-dev libfontconfig-dev libgl-dev libopengl-dev libegl-dev libglib2.0-dev libdbus-1-dev

      - name: Build the unit tests with AddressSanitizer and UBSan
        run: |
          FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake -S src/engine -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_C_FLAGS="$FLAGS" -DCMAKE_CXX_FLAGS="$FLAGS" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build --target FlipendoTests

      - name: Unit tests
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

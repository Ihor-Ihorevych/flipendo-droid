# Builds Flipendo for Windows, Linux and macOS on GitHub's runners and zips each (tools/release/package.sh).
# Run it by hand (Actions > Release > Run workflow) to get the zips as build artifacts; push a version tag
# (v<major>.<minor>, e.g. v1.0, v1.1) to also get a draft release "Flipendo 1.1" with the three zips attached,
# to check and publish.
name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-2025
          - platform: linux
            os: ubuntu-24.04
          - platform: macos
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Release name
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"; else echo "TAG=build-${GITHUB_SHA::7}" >> "$GITHUB_ENV"; fi

      - name: Apply the engine patches
        run: bash tools/apply_patches.sh

      - name: Linux packages
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-14 libx11-dev libxi-dev libxkbcommon-dev libasound2-dev \
            libopenal-dev libfontconfig-dev libgl-dev libopengl-dev libegl-dev libglib2.0-dev libdbus-1-dev

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        run: |
          cmake -S src/engine -B build -A x64
          cmake --build build --config Release --target SurrealEngine --parallel

      - name: Build (Linux)
        if: matrix.platform == 'linux'
        run: |
          cmake -S src/engine -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_BUILD_RPATH_USE_ORIGIN=ON
          cmake --build build --target SurrealEngine

      - name: Build (macOS)
        if: matrix.platform == 'macos'
        run: |
          cmake -S src/engine -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build --target SurrealEngine --parallel $(sysctl -n hw.ncpu)

      - name: Package
        run: bash tools/release/package.sh ${{ matrix.platform }} build dist "$TAG"

      - uses: actions/upload-artifact@v4
        with:
          name: flipendo-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 0

      - name: Version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # The commits since the previous version tag (all of them for the first one), newest first.
      - name: Release notes
        working-directory: src
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          {
            echo "## Changes${prev:+ since $prev}"
            echo
            git log --no-merges --format="- %s ([%h]($url/commit/%H))" ${prev:+"$prev.."}"$GITHUB_REF_NAME"
            if [ -n "$prev" ]; then
              echo
              echo "Full diff: [$prev...$GITHUB_REF_NAME]($url/compare/$prev...$GITHUB_REF_NAME)"
            fi
          } > ../notes.md
          cat ../notes.md

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Flipendo ${{ env.VERSION }}
          body_path: notes.md
          files: dist/*.zip

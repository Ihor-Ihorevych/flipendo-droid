# Builds the light Android APK (no game data) on a Windows runner with the same script as a local build
# (android/build-apk.sh, Git Bash). A pushed tag android-* also publishes it as a GitHub release; a manual run keeps it as an
# artifact of the run. The APK has the PS2 tab working: the runner and the compiler it carries are built by the repository
# Ihor-Ihorevych/hp2ps2recomp and downloaded here. See docs/android.md ("Builds on GitHub") and docs/ps2.md.
name: Android APK

on:
  push:
    tags: ['android-*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # The PS2 tab's files, from the releases of https://github.com/Ihor-Ihorevych/hp2ps2recomp (its workflow "Flipendo Android" makes them):
  # the compiler the phone translates a game with, and the runner. Update the runner's tag when that repository's runner is newer.
  PS2_TOOLCHAIN_TAG: toolchain-llvm20.1.8-ndk28.2
  PS2_RUNNER_TAG: runner-bbe854688

jobs:
  build:
    runs-on: windows-latest
    # the signing key is an environment secret (Settings > Environments); a job only sees those when it names the environment
    environment: ANDROID_DEBUG_KEYSTORE
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version code is the commit count; build-info.txt names the commit

      - name: SurrealEngine submodule
        run: git submodule update --init src/engine

      # Harry Potter 3 runs on the Rust engine (R3paro, the repository r3paro; its folder here keeps the name hp3-engine, which build-apk.sh looks for), built here for the phone and linked against this APK's own
      # libSDL3.so by android/build-apk.sh. A private repository needs the secret HP3_ENGINE_TOKEN (a token that can read it).
      - name: HP3 engine
        uses: actions/checkout@v4
        with:
          repository: Ihor-Ihorevych/r3paro
          path: hp3-engine
          token: ${{ secrets.HP3_ENGINE_TOKEN || github.token }}

      - name: Rust target for the phone
        run: rustup target add aarch64-linux-android

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      - name: Android SDK packages
        run: |
          SDKMANAGER="$(cygpath -u "$ANDROID_HOME")/cmdline-tools/latest/bin/sdkmanager.bat"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null

      # The APK must be signed with the same key every time, or a new build won't install over an older one. The key is the
      # repository secret ANDROID_DEBUG_KEYSTORE (android/debug.keystore, base64); without it the build makes a throwaway key.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/debug.keystore
          else
            echo "::warning::No ANDROID_DEBUG_KEYSTORE secret: this APK is signed with a new key and won't update an installed one"
          fi

      # a release tag is android-v<android/VERSION>: a tag that doesn't match would publish an APK with another number inside
      - name: Version
        id: version
        run: |
          VERSION="$(tr -d ' \r\n' < android/VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "date=$(date +%F)" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]] && [ "$GITHUB_REF_NAME" != "android-v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match android/VERSION ($VERSION): tag android-v$VERSION"
            exit 1
          fi

      # build-apk.sh packs android/deps/ps2out when it is complete (libps2main.so, libSDL2ps2.so, libps2clang.so, libps2lld.so, sysroot.zip);
      # without it the APK has no PS2 support
      - name: PS2 runner and compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p android/deps/ps2out
          gh release download "$PS2_TOOLCHAIN_TAG" --repo Ihor-Ihorevych/hp2ps2recomp --dir android/deps/ps2out --clobber             --pattern libps2clang.so --pattern libps2lld.so --pattern sysroot.zip
          gh release download "$PS2_RUNNER_TAG" --repo Ihor-Ihorevych/hp2ps2recomp --dir android/deps/ps2out --clobber             --pattern libps2main.so --pattern libSDL2ps2.so
          for f in libps2main.so libSDL2ps2.so libps2clang.so libps2lld.so sysroot.zip; do test -s "android/deps/ps2out/$f" || { echo "::error::missing PS2 file $f"; exit 1; }; done

      - name: Build
        run: android/build-apk.sh --hp3-rust "$GITHUB_WORKSPACE/hp3-engine"

      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: flipendo-droid
          path: android/dist/flipendo-droid.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Flipendo Droid ${{ steps.version.outputs.version }} (${{ steps.version.outputs.date }})
          files: android/dist/flipendo-droid.apk
          prerelease: true
          generate_release_notes: true
          body: |
            The light build: **no game data inside**. You need your own copy of the PC game (2001): copy its folder to the phone
            (Internal storage / FlipendoHP, or anywhere and pick it with Choose folder). Steps, controls and settings: README.
            Android 10+, 64-bit. News and help: https://t.me/flipendodroid

<?xml version="1.0" encoding="UTF-8"?>
<!-- A wide pill (SELECT): the toolbar's pill of FlipendoActivity (the same disc fill and rim, ends fully rounded); pressed: gold. Layers: base, down. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 72">
  <rect x="1" y="1" width="178" height="70" rx="35" fill="#181722" fill-opacity="0.502"/>
  <rect x="1" y="1" width="178" height="70" rx="35" fill="none" stroke="#FFFFFF" stroke-opacity="0.333" stroke-width="3" vector-effect="non-scaling-stroke"/>
  <g id="down">
    <rect x="1" y="1" width="178" height="70" rx="35" fill="#E8C15A" fill-opacity="0.902"/>
    <rect x="1" y="1" width="178" height="70" rx="35" fill="none" stroke="#E8C15A" stroke-width="3" vector-effect="non-scaling-stroke"/>
  </g>
</svg>
